name: Build V2 Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - baseline/v2

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --console --name HRR_Reconstructor_V2 src/hrr_reconstructor_v2.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/HRR_Reconstructor_V2.exe')) {
            throw 'HRR_Reconstructor_V2.exe was not produced.'
          }
          Get-Item 'dist/HRR_Reconstructor_V2.exe' | Format-List Name,Length,FullName

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRR-Recovery-V2-Windows
          path: dist/HRR_Reconstructor_V2.exe
          if-no-files-found: error
