[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrr-recovery"
version = "0.1.0"
description = "Forensic analysis and recovery toolkit for HRR files"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
